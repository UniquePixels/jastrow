name: CI - Quality checks

on:
  workflow_call:
  pull_request:
    branches:
      - main
      - v2
  push:
    branches:
      - main
      - v2

permissions: {}

jobs:
  quality:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Lint
            command: bun qa:ci
          - name: Type Check
            command: echo "::add-matcher::.github/matchers/tsc.json" && bun tsc --noEmit --skipLibCheck --pretty false
          # The fast gate: every test that does not read the pinned
          # snapshot. About two seconds, most of it the truth-tree
          # validation — see admin/pipeline/test-tiers.test.ts.
          - name: Test
            command: bun qa:test
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@f808768d1510423e83855289c910610ca9b43176 # v2.17.0
        with:
          disable-sudo: true
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            github.com:443
            mise-versions.jdx.dev:443
            mise.jdx.dev:443
            registry.npmjs.org:443
            release-assets.githubusercontent.com:443
            tuf-repo-cdn.sigstore.dev:443
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Setup
        uses: ./.github/actions/setup-env
      - name: ${{ matrix.name }}
        run: ${{ matrix.command }}

  # Rebuild == truth (consolidation spec §5.1): the committed truth is
  # exactly what migrate produces from the committed snapshot, rules and
  # patches. No fetch; ~2 min. The blessing doc is regenerated by the
  # same run, so a doc left stale against its own gates fails here too.
  # --strict: on the committed snapshot a stale pin or a drifted patch
  # can only be an authoring mistake, so CI keeps refusing it — the
  # default (non-strict) run merely reports drift, which is right for
  # a new export but wrong for this fixed one.
  rebuild:
    name: Rebuild
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@f808768d1510423e83855289c910610ca9b43176 # v2.17.0
        with:
          disable-sudo: true
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            github.com:443
            mise-versions.jdx.dev:443
            mise.jdx.dev:443
            registry.npmjs.org:443
            release-assets.githubusercontent.com:443
            tuf-repo-cdn.sigstore.dev:443
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Setup
        uses: ./.github/actions/setup-env
      - name: Rebuild truth from the committed snapshot
        run: |
          rm -rf data/entries
          bun pipeline:migrate --write --strict
      - name: Compare against the committed truth
        run: |
          changed="$(git status --porcelain -- data/entries docs/v2/migration-blessing.md)"
          if [ -n "$changed" ]; then
            echo "::error::rebuild differs from committed truth in $(printf '%s\n' "$changed" | wc -l) path(s)"
            printf '%s\n' "$changed" | head -50
            exit 1
          fi

  # The slow gate, split out 2026-08-31: every *.corpus.test.ts, which
  # streams all 32,512 entries of the source snapshot and runs the
  # transform pipeline over them. It was one job bundling all five
  # shards as parallel processes, but that put the pair over the
  # runner's wall clock and cost PR #58 a SIGTERM with every assertion
  # it reached passing. On 2026-09-08 the shards moved to their own
  # runners (this job's matrix) because five in-job processes starved
  # each other on the 4-vCPU runner. corpus-audit below aggregates the
  # matrix so the required check keeps its name.
  corpus:
    name: Corpus Audit (${{ matrix.shard }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        shard:
          - pipeline-links
          - residue-sweep
          - commutation
          - registry.order
          - rest
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@f808768d1510423e83855289c910610ca9b43176 # v2.17.0
        with:
          disable-sudo: true
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            github.com:443
            mise-versions.jdx.dev:443
            mise.jdx.dev:443
            registry.npmjs.org:443
            release-assets.githubusercontent.com:443
            tuf-repo-cdn.sigstore.dev:443
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Setup
        uses: ./.github/actions/setup-env
      - name: Corpus Audit (${{ matrix.shard }})
        run: bun run audit:corpus
        env:
          CORPUS_SHARD: ${{ matrix.shard }}

  corpus-audit:
    name: Corpus Audit
    needs: corpus
    if: always()
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@f808768d1510423e83855289c910610ca9b43176 # v2.17.0
        with:
          disable-sudo: true
          egress-policy: block
      - name: Corpus Audit
        run: |
          test "${{ needs.corpus.result }}" = "success"

  dependency-review:
    name: Dependency Review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@f808768d1510423e83855289c910610ca9b43176 # v2.17.0
        with:
          disable-sudo: true
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            api.securityscorecards.dev:443
            github.com:443
            api.deps.dev:443
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Dependency review
        uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0
