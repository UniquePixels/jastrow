name: Setup Environment
description: Install mise, project tools, and Bun dependencies

runs:
  using: composite
  steps:
    - name: Install mise
      uses: jdx/mise-action@v2
      with:
        install: true
    - name: Install dependencies
      # Frozen lockfile keeps CI deterministic. Bun does not run dependency
      # lifecycle scripts by default, so Playwright's browser download is
      # skipped (only registry.npmjs.org is needed — see harden-runner egress).
      shell: bash
      run: bun install --frozen-lockfile
